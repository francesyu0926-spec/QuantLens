[package]
name = "quantlens"
version = "0.1.0"
description = "QuantLens desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "quantlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]